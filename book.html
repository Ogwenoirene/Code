<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <header>
    <h1>Booking for</h1>
    <p>please enter your details and confirm your booking and secure your plot</p>
   </header>
   <main>
    <form action="/submit">
        <label for="option" class="option">
            <input type="radio" required value="classic-cut" name="service">
            <span>classic cut <small>45 min &middot; Kes 800</small></span>
        </label> 
        <label for="option" class="option">
            <input type="radio" required value="skin fade-cut" name="service">
            <span>skin fade <small>45 min &middot; Kes 1000</small></span>
        </label> <br>
        <label for="phone">phone (mpesa)</label>
        <input type="tel"  id="phone" placeholder="please enter your number..."><br> 
        <label class="slot">
            <input type="radio" name="time"  value="09.30"> <span>9.30 </span>
        </label>
        <label class="slot">
            <input type="radio" name="time"  value="10.30" disabled><span>10.00 </span>
        </label>
        <br>
        <label for="Name">Name:</label>
        <input type="text" placeholder="Enter your name" required><br><br>
        <label for="message">message:</label>
        <textarea name="message" id="name">
            Enter your message ...
        </textarea>
        <br><br>
        <label for="Email">Email</label>
        <input type="Email"> <br> <br>
        <label for="password">password:</label>
        <input type="password"><br><br>
        <label for="Category">Category</label>
        <select name="Category" id="Category">
            <option value="">--select an option</option>
            <option value="option1">option1</option>
            <option value="option2">option2</option>
            <option value="option3">option3</option>
            <option value="option4">option4</option>
        </select><br>
        <label for="Preference">preferences</label>
     <label for="notication">
        <input type="checkbox" name="preferences" value="notifications">notifications
     </label>
     <label for="newsletter">
        <input type="checkbox" name="preferences" value="Newsletter">Newsletter
     </label>
     <label for="updates">
         <input type="checkbox" name="preferences" value="updates">updates
     </label>
    <label for="date">date:</label>
     <input type="date" id="date" name="date"> <br>
     <label for="colour">Theme colour:</label>
     <input type="color" id="color" name="color" value="red">
     <br>
     <label for="submit">submit
         <input type="submit" id="submit" name="submit">
     </label>
   </form>
    </main>
</body>
</html>
